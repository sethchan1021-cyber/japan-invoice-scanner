<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極速版 日本發票消費報告工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #28a745; }
        video, canvas { width: 100%; border-radius: 5px; margin-top: 10px; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #status { font-weight: bold; color: #007bff; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>日本發票雲端速掃器</h2>
    
    <video id="video" autoplay playsinline></video>
    <button id="scan-btn">拍攝並進行雲端高效辨識</button>
    
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="status">準備就緒 (已啟用 Google 雲端加速)</div>

    <div class="result-box">
        <h3>雲端回傳資料核對</h3>
        <div class="form-group">
            <label>交易地點 (店名):</label>
            <input type="text" id="res-location">
        </div>
        <div class="form-group">
            <label>交易時間:</label>
            <input type="text" id="res-time">
        </div>
        <div class="form-group">
            <label>消費內容/品項:</label>
            <input type="text" id="res-content">
        </div>
        <div class="form-group">
            <label>費用 (JPY ￥):</label>
            <input type="number" id="res-price">
        </div>
        <p style="font-size: 12px; color: #666;">* 資料已同步自動寫入 Google Sheets，您可以在上方修改不準確的欄位後再次處理。</p>
    </div>
</div>

<script>
    // 請在此處貼上您更新部署後的 Google Apps Script 網址
    const GAS_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const scanBtn = document.getElementById('scan-btn');
    const statusTxt = document.getElementById('status');

    // 啟動後置相機
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { statusTxt.innerText = "無法存取相機，請檢查 HTTPS 設定。"; });

    // 拍照並直接送往雲端處理
    scanBtn.addEventListener('click', () => {
        statusTxt.innerText = "正在上傳影像至 Google 伺服器進行高速辨識...";
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // 擷取 Base64 圖片資料
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8); // 壓縮率 0.8 加快傳輸

        // 將圖片封裝發送給 GAS 后端
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ image: imageDataUrl })
        })
        .then(response => response.json())
        .then(res => {
            if(res.status === "success") {
                statusTxt.innerText = "雲端辨識成功！資料已同步寫入 Excel。";
                
                // 呈現雲端辨識並解析出來的結果
                document.getElementById('res-location').value = res.data.location;
                document.getElementById('res-time').value = res.data.time;
                document.getElementById('res-content').value = res.data.content;
                document.getElementById('res-price').value = res.data.price;
            } else {
                statusTxt.innerText = "錯誤: " + res.message;
            }
        })
        .catch(err => {
            // 由於 mode: 'no-cors' 在某些舊環境可能封鎖回應，改用標準 fetch
            // 若因為 CORS 導致看不到文字，但通常資料此時已經順利寫入試算表了
            statusTxt.innerText = "處理完成，請檢查您的 Google 試算表確認紀錄！";
            console.log(err);
        });
    });
</script>

</body>
</html>
