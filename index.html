<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本發票消費報告工具</title>
    <!-- 引入 Tesseract.js 用於發票 OCR 辨識 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #007bff; }
        video, canvas, img {
            width: 100%;
            max-width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #status {
            font-weight: bold;
            color: #d9534f;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>日本發票掃描器</h2>
    
    <!-- 相機畫面區 -->
    <video id="video" autoplay playsinline></video>
    <button id="capture-btn">拍照並辨識發票</button>
    
    <!-- 隱藏的 Canvas 用於擷取圖片 -->
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="status">準備就緒</div>

    <!-- 辨識與修改欄位區 -->
    <div class="result-box">
        <h3>交易資料核對</h3>
        <div class="form-group">
            <label>交易地點 (店名):</label>
            <input type="text" id="res-location">
        </div>
        <div class="form-group">
            <label>交易時間:</label>
            <input type="text" id="res-time" placeholder="YYYY-MM-DD HH:MM">
        </div>
        <div class="form-group">
            <label>消費內容/品項:</label>
            <input type="text" id="res-content">
        </div>
        <div class="form-group">
            <label>費用 (JPY ￥):</label>
            <input type="number" id="res-price">
        </div>
        <button id="upload-btn" style="background-color: #28a745;">匯出至 Google Excel</button>
    </div>
</div>

<script>
    // 請將你在 Google Apps Script 部署得到的 URL 貼在此處
    const GAS_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const statusTxt = document.getElementById('status');

    // 啟動相機
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("無法啟動相機: ", err);
            statusTxt.innerText = "無法存取相機，請檢查權限或使用 HTTPS 環境。";
        });

    // 拍照並啟動 OCR
    captureBtn.addEventListener('click', () => {
        statusTxt.innerText = "正在擷取影像並載入日文 OCR 模型...";
        
        // 將動態視訊繪製到 Canvas 上
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // 取得 Base64 圖片資料進行辨識
        const imageDataUrl = canvas.toDataURL('image/jpeg');

        // 呼叫 Tesseract.js 解析日文 (jpn) 與英文/數字 (eng)
        Tesseract.recognize(
            imageDataUrl,
            'jpn+eng',
            { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
            statusTxt.innerText = "辨識完成！請核對資料。";
            parseInvoiceText(text);
        }).catch(err => {
            console.error(err);
            statusTxt.innerText = "OCR 辨識發生錯誤。";
        });
    });

    // 簡易文字解析邏輯 (針對日本發票常見關鍵字)
    function parseInvoiceText(rawText) {
        console.log("原始 OCR 文字:", rawText);
        
        // 1. 嘗試尋找金額 (找 ￥ 符號或 Total/合計 後面的數字)
        let price = 0;
        const priceRegex = /(?:合計|小計|金額|TOTAL)\s*[:：]?\s*[￥¥]?\s*([\d,]+)/i;
        const priceMatch = rawText.match(priceRegex);
        if (priceMatch) {
            price = priceMatch[1].replace(/,/g, '');
        }

        // 2. 嘗試尋找日期時間 (搜尋格式如 2026年X月X日 或 YYYY-MM-DD)
        let time = "";
        const dateRegex = /(\d{4}[-/年]\d{1,2}[-/月]\d{1,2})/;
        const dateMatch = rawText.match(dateRegex);
        if (dateMatch) {
            time = dateMatch[1];
        }

        // 3. 嘗試提取第一行通常作為商店地點/名稱
        const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let location = lines.length > 0 ? lines[0] : "未知商店";
        
        // 填入前端輸入框供使用者確認或修改
        document.getElementById('res-location').value = location;
        document.getElementById('res-time').value = time;
        document.getElementById('res-content').value = "發票內容摘要";
        document.getElementById('res-price').value = price;
    }

    // 上傳資料到 Google Sheets
    uploadBtn.addEventListener('click', () => {
        if(GAS_WEB_APP_URL === "https://script.google.com/macros/s/AKfycbzwy9Z2DAOGTZDuNHPYcYyIBoi5KS4uixKIVps87oi7qpHiWuWLXKEta2EPqDCv1DkG/exec") {
            alert("請先在程式碼中設定您的 Google Apps Script URL！");
            return;
        }

        statusTxt.innerText = "正在上傳至 Google 試算表...";

        const payload = {
            time: document.getElementById('res-time').value,
            location: document.getElementById('res-location').value,
            content: document.getElementById('res-content').value,
            price: document.getElementById('res-price').value
        };

        // 使用 fetch 發送 POST 請求給 GAS
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // 避開跨網域 CORS 問題
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusTxt.innerText = "上傳成功！已成功紀錄至旅程消費報告。";
            alert("資料已成功寫入 Google Sheets！");
        })
        .catch(err => {
            console.error(err);
            statusTxt.innerText = "上傳失敗，請檢查網路或 API 設定。";
        });
    });
</script>

</body>
</html>
